clusterID: ""

# The Secret must contain a complete PostgreSQL connection string under urlKey.
# Migrations are intentionally managed separately from the application release.
database:
  existingSecret: replicasense-database
  urlKey: url

imagePullPolicy: IfNotPresent
imagePullSecrets: []
serviceMonitor:
  enabled: true
  # kube-prometheus-stack selects ServiceMonitors by its Helm release label.
  # Change this when that release has a different name (for example,
  # `--set-string serviceMonitor.labels.release=observability`).
  labels:
    release: monitoring
  interval: 15s

components:
  controller:
    replicas: 2
    # Set digest (for example sha256:...) in production to pin an image by
    # content. When digest is set it takes precedence over tag.
    image: {repository: ghcr.io/canberkturan/replicasense-controller, tag: "0.3.5", digest: ""}
    serviceAccount: controller
    ports: [{name: metrics, containerPort: 8080}, {name: health, containerPort: 8081}]
    resources:
      requests: {cpu: 200m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}
    pdb: {minAvailable: 1}
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: controller
    env:
      REPLICASENSE_TRAINER_JOB_CLEANUP_INTERVAL: 24h
      # Keep the production-safe 7d floor. This may be lowered only for an
      # intentionally accelerated, non-production benchmark environment.
      REPLICASENSE_MIN_TRAINING_WINDOW: 168h
    probes:
      readiness: {httpGet: {path: /readyz, port: health}}
      liveness: {httpGet: {path: /healthz, port: health}, initialDelaySeconds: 60}
  sampler:
    replicas: 1
    image: {repository: ghcr.io/canberkturan/replicasense-sampler, tag: "0.3.5", digest: ""}
    ports: [{name: metrics, containerPort: 8080}]
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    probes:
      readiness: {tcpSocket: {port: metrics}}
      liveness: {tcpSocket: {port: metrics}, initialDelaySeconds: 60}
    env:
      # Maximum source-history interval fetched after a Prometheus query
      # recovers. Larger values can repair longer outages but cost more query
      # work; missing history is never invented.
      REPLICASENSE_SAMPLING_RECOVERY_WINDOW: 24h
  scaler:
    replicas: 2
    image: {repository: ghcr.io/canberkturan/replicasense-scaler, tag: "0.3.5", digest: ""}
    ports: [{name: grpc, containerPort: 6000}, {name: metrics, containerPort: 8080}]
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    probes:
      readiness: {tcpSocket: {port: grpc}}
      liveness: {tcpSocket: {port: grpc}}
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: scaler
    env: {}
  forecaster:
    replicas: 1
    image: {repository: ghcr.io/canberkturan/replicasense-forecaster, tag: "0.3.5-xgboost", digest: ""}
    serviceAccount: forecaster
    ports: [{name: metrics, containerPort: 8080}]
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    probes:
      readiness: {tcpSocket: {port: metrics}}
      liveness: {tcpSocket: {port: metrics}}
    env:
      REPLICASENSE_SEASONAL_PERIOD: 24h
      REPLICASENSE_FORECAST_INTERVAL: 1m
      REPLICASENSE_MODEL_MAX_AGE: 72h
      # An event needs two consecutive samples with both an abnormal slope and
      # demand above its recent baseline. These bounds cap surge projection.
      REPLICASENSE_SURGE_SLOPE_MULTIPLIER: "3"
      REPLICASENSE_SURGE_BASELINE_MULTIPLIER: "1.5"
      REPLICASENSE_SURGE_CONFIRMATION_SAMPLES: "2"
      REPLICASENSE_SURGE_MAX_MULTIPLIER: "1.5"
  training-scheduler:
    replicas: 1
    image: {repository: ghcr.io/canberkturan/replicasense-training-scheduler, tag: "0.3.5", digest: ""}
    serviceAccount: training-scheduler
    ports: []
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    env:
      REPLICASENSE_TRAINER_IMAGE: ghcr.io/canberkturan/replicasense-trainer:0.3.5-xgboost
      REPLICASENSE_TRAINING_INTERVAL: 24h
      # Scheduling cadence and loop polling are intentionally separate: the
      # latter makes immediateTraining responsive without creating daily Jobs.
      REPLICASENSE_TRAINING_POLL_INTERVAL: 1m
      REPLICASENSE_TRAINER_SEASONAL_PERIOD: 24h
      # Keep production strict: source gaps over two sampling intervals reject
      # training rather than silently fitting an interrupted time series.
      REPLICASENSE_TRAINER_MAX_GAP_INTERVALS: "2"

trainer:
  images:
    # Leave empty until a matching PyTorch GRU image tag has been published.
    # When set, only modelEngine: gru Jobs use this CPU-only image; all other
    # engines continue using components.training-scheduler.env.REPLICASENSE_TRAINER_IMAGE.
    gru: ""
  # These bounds apply to short-lived Trainer Jobs, not the scheduler pod.
  # XGBoost and PyTorch training can be CPU and memory intensive; raise them
  # only after measuring a realistic workload and retaining cluster headroom.
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  activeDeadlineSeconds: 3600

scaler:
  service:
    port: 6000
  pdb:
    minAvailable: 1

controller:
  pdb:
    minAvailable: 1

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}
