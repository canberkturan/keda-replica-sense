clusterID: ""

# The Secret must contain a complete PostgreSQL connection string under urlKey.
# Migrations are intentionally managed separately from the application release.
database:
  existingSecret: replicasense-database
  urlKey: url

imagePullPolicy: IfNotPresent
imagePullSecrets: []
serviceMonitor:
  enabled: true
  labels: {}
  interval: 15s

components:
  controller:
    replicas: 2
    # Set digest (for example sha256:...) in production to pin an image by
    # content. When digest is set it takes precedence over tag.
    image: {repository: ghcr.io/canberkturan/replicasense-controller, tag: "0.3.1", digest: ""}
    serviceAccount: controller
    ports: [{name: metrics, containerPort: 8080}, {name: health, containerPort: 8081}]
    resources:
      requests: {cpu: 200m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}
    pdb: {minAvailable: 1}
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: controller
    env:
      REPLICASENSE_TRAINER_JOB_CLEANUP_INTERVAL: 24h
    probes:
      readiness: {httpGet: {path: /readyz, port: health}}
      liveness: {httpGet: {path: /healthz, port: health}}
  sampler:
    replicas: 1
    image: {repository: ghcr.io/canberkturan/replicasense-sampler, tag: "0.3.1", digest: ""}
    ports: [{name: metrics, containerPort: 8080}]
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    probes:
      readiness: {tcpSocket: {port: metrics}}
      liveness: {tcpSocket: {port: metrics}}
    env:
      # Maximum source-history interval fetched after a Prometheus query
      # recovers. Larger values can repair longer outages but cost more query
      # work; missing history is never invented.
      REPLICASENSE_SAMPLING_RECOVERY_WINDOW: 24h
  scaler:
    replicas: 2
    image: {repository: ghcr.io/canberkturan/replicasense-scaler, tag: "0.3.1", digest: ""}
    ports: [{name: grpc, containerPort: 6000}, {name: metrics, containerPort: 8080}]
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    probes:
      readiness: {tcpSocket: {port: grpc}}
      liveness: {tcpSocket: {port: grpc}}
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: scaler
    env: {}
  forecaster:
    replicas: 1
    image: {repository: ghcr.io/canberkturan/replicasense-forecaster, tag: "0.3.1-xgboost", digest: ""}
    serviceAccount: forecaster
    ports: [{name: metrics, containerPort: 8080}]
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    probes:
      readiness: {tcpSocket: {port: metrics}}
      liveness: {tcpSocket: {port: metrics}}
    env:
      REPLICASENSE_SEASONAL_PERIOD: 24h
      REPLICASENSE_FORECAST_INTERVAL: 1m
      REPLICASENSE_MODEL_MAX_AGE: 72h
  training-scheduler:
    replicas: 1
    image: {repository: ghcr.io/canberkturan/replicasense-training-scheduler, tag: "0.3.1", digest: ""}
    serviceAccount: training-scheduler
    ports: []
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    env:
      REPLICASENSE_TRAINER_IMAGE: ghcr.io/canberkturan/replicasense-trainer:0.3.1-xgboost
      REPLICASENSE_TRAINING_INTERVAL: 24h

trainer:
  # These bounds apply to short-lived Trainer Jobs, not the scheduler pod.
  # XGBoost training can be CPU and memory intensive; raise them only after
  # measuring a realistic workload and retaining cluster headroom.
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  activeDeadlineSeconds: 3600

scaler:
  service:
    port: 6000
  pdb:
    minAvailable: 1

controller:
  pdb:
    minAvailable: 1

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}
