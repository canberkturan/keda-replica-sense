version: 0.3.8
name: replica-sense
alternativeName: keda-replica-sense
category: ai-machine-learning
displayName: ReplicaSense
createdAt: "2026-10-02T20:41:56Z"
description: KEDA external scaler for safe predictive autoscaling using Prometheus, XGBoost or GRU forecasts, and conservative surge protection.
license: Apache-2.0
homeURL: https://github.com/canberkturan/keda-replica-sense
appVersion: 0.3.8
keywords: [keda, keda-scaler, external-scaler, autoscaling, predictive-autoscaling, xgboost, gru, prometheus, ai-machine-learning]
containersImages:
  - {name: Controller, image: ghcr.io/canberkturan/replicasense-controller:0.3.8}
  - {name: Sampler, image: ghcr.io/canberkturan/replicasense-sampler:0.3.8}
  - {name: External scaler, image: ghcr.io/canberkturan/replicasense-scaler:0.3.8}
  - {name: XGBoost and GRU forecaster, image: ghcr.io/canberkturan/replicasense-forecaster:0.3.8-xgboost}
  - {name: XGBoost trainer, image: ghcr.io/canberkturan/replicasense-trainer:0.3.8-xgboost}
  - {name: CPU PyTorch GRU trainer, image: ghcr.io/canberkturan/replicasense-trainer:0.3.8-pytorch-gru}
  - {name: Training scheduler, image: ghcr.io/canberkturan/replicasense-training-scheduler:0.3.8}
maintainers:
  - {name: Canberk TURAN, email: canberkkturann@gmail.com}
links:
  - {name: Source, url: https://github.com/canberkturan/keda-replica-sense}
  - {name: Documentation, url: https://github.com/canberkturan/keda-replica-sense/tree/main/docs}
  - {name: Support, url: https://github.com/canberkturan/keda-replica-sense/issues}
install: |
  Install the ReplicaSense Helm chart, then add an external trigger to a KEDA ScaledObject.
changes:
  - kind: changed
    description: Replaced the CPU PyTorch GRU Trainer's Debian runtime with a non-root Wolfi Python image and included time-zone data for calendar features.
