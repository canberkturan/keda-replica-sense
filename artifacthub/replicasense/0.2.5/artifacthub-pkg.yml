version: 0.2.5
name: replicasense
alternativeName: replica-sense
category: ai-machine-learning
displayName: ReplicaSense
createdAt: "2026-09-14T19:41:49Z"
description: KEDA external scaler for safe predictive autoscaling using Prometheus, XGBoost forecasts, and surge protection.
license: Apache-2.0
homeURL: https://github.com/canberkturan/keda-replica-sense
appVersion: 0.2.5
keywords:
  - keda
  - keda-scaler
  - external-scaler
  - autoscaling
  - predictive-autoscaling
  - xgboost
  - prometheus
  - ai-machine-learning
containersImages:
  - name: Controller
    image: ghcr.io/canberkturan/replicasense-controller:0.2.5
  - name: Sampler
    image: ghcr.io/canberkturan/replicasense-sampler:0.2.5
  - name: External scaler
    image: ghcr.io/canberkturan/replicasense-scaler:0.2.5
  - name: XGBoost forecaster
    image: ghcr.io/canberkturan/replicasense-forecaster:0.2.5-xgboost
  - name: XGBoost trainer
    image: ghcr.io/canberkturan/replicasense-trainer:0.2.5-xgboost
  - name: Training scheduler
    image: ghcr.io/canberkturan/replicasense-training-scheduler:0.2.5
maintainers:
  - name: Canberk TURAN
    email: canberkkturann@gmail.com
links:
  - name: Source
    url: https://github.com/canberkturan/keda-replica-sense
  - name: Documentation
    url: https://github.com/canberkturan/keda-replica-sense/tree/main/docs
  - name: Support
    url: https://github.com/canberkturan/keda-replica-sense/issues
install: |
  Install the ReplicaSense Helm chart, then add an `external` trigger to a KEDA
  `ScaledObject`. KEDA, Prometheus Operator, and PostgreSQL are external
  dependencies; see the package README for the complete production setup.
changes:
  - kind: added
    description: Initial Artifact Hub metadata for the ReplicaSense KEDA external scaler.
