name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/...

  native-xgboost:
    name: Native XGBoost verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compile and test every package with native XGBoost
        run: >-
          docker build --target build --file Dockerfile.xgboost
          --build-arg COMMAND=replicasense-forecaster .
