name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: azure/setup-helm@v4
      - run: helm lint charts/replicasense
      - run: helm template replicasense charts/replicasense --set clusterID=ci-test >/dev/null

  native-xgboost:
    name: Native XGBoost verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and test the native XGBoost runtime image
        run: >-
          docker build --file Dockerfile.xgboost
          --build-arg COMMAND=replicasense-forecaster
          --tag replicasense-forecaster:ci .
      - name: Verify XGBoost libraries load in the final image
        run: |
          result="$(docker run --rm replicasense-forecaster:ci 2>&1 || true)"
          test "$result" = "REPLICASENSE_CLUSTER_ID and REPLICASENSE_DATABASE_URL are required"

  model-evaluation-postgres:
    name: Model promotion transactions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: replicasense_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
      - run: go test -race -count=1 ./internal/postgres
        env:
          REPLICASENSE_TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/replicasense_test?sslmode=disable

  pytorch-partitions:
    name: GRU temporal isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --file Dockerfile.pytorch-gru --tag replicasense-trainer:gru-ci .
      - run: >-
          docker run --rm --volume "$PWD/pytorch:/app:ro" --workdir /app
          --entrypoint /usr/bin/python replicasense-trainer:gru-ci
          -m unittest -v test_gru_trainer
